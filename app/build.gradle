plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worldplay.game'
    compileSdk 33

    defaultConfig {
        applicationId "com.worldplay.game"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "worldplay123"
                keyAlias System.getenv("KEY_ALIAS") ?: "worldplay"
                keyPassword System.getenv("KEY_PASSWORD") ?: "worldplay123"
            } else {
                // Safe fallback to debug signature if custom keystore has not been provisioned yet
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // Zero heavy external dependencies required; native Android WebView with modern hardware acceleration
}
