
name: Build Worldplay Android APK and AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build and Verify Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install web dependencies
        run: npm install --no-audit --no-fund

      - name: 4. Build web game for Android WebView
        run: |
          npx vite build --base=./
          mkdir -p app/src/main/assets
          cp -r dist/. app/src/main/assets/

      - name: 5. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 6. Prepare Android resources
        run: |
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h48v48h-48z"/>
              <path
                  android:fillColor="#172554"
                  android:pathData="M24,5 L29,16 L41,17 L32,25 L35,38 L24,32 L13,38 L16,25 L7,17 L19,16 Z"/>
          </vector>
          EOF

          sed -i \
            -e 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' \
            app/src/main/AndroidManifest.xml

      - name: 7. Setup Gradle
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
            unzip -q gradle-7.5.1-bin.zip
            ./gradle-7.5.1/bin/gradle wrapper \
              --gradle-version 7.5.1
          fi
          chmod +x gradlew

      - name: 8. Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 9. Verify Debug APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: 10. Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Worldplay-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 11. Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/release.keystore

          keytool -list \
            -keystore app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 12. Build signed Release APK and AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: 13. Upload signed Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Worldplay-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 14. Upload signed Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Worldplay-Signed-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
