<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#2c221a" />
      <stop offset="60%" stopColor="#14100c" />
      <stop offset="100%" stopColor="#080605" />
    </radialGradient>

    <!-- Golden Imperial Cyrus Gradient -->
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff7cc" />
      <stop offset="35%" stopColor="#ffd24d" />
      <stop offset="70%" stopColor="#d49216" />
      <stop offset="100%" stopColor="#784906" />
    </linearGradient>

    <!-- Royal Ruby Jewel Gradient -->
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#ff7b90" />
      <stop offset="45%" stopColor="#e11d48" />
      <stop offset="100%" stopColor="#881337" />
    </radialGradient>

    <!-- Turquoise Lapis Lazuli Gradient -->
    <radialGradient id="turquoiseGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#67e8f9" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#0e7490" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base (Standard Android & iOS 512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#5a4630" stroke-width="6" />

  <!-- Achaemenid Geometric Border Accent -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#d49216" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Background Chessboard Watermark -->
  <g opacity="0.12">
    <rect x="70" y="70" width="93" height="93" fill="#ffffff" />
    <rect x="256" y="70" width="93" height="93" fill="#ffffff" />
    <rect x="163" y="163" width="93" height="93" fill="#ffffff" />
    <rect x="349" y="163" width="93" height="93" fill="#ffffff" />
    <rect x="70" y="256" width="93" height="93" fill="#ffffff" />
    <rect x="256" y="256" width="93" height="93" fill="#ffffff" />
  </g>

  <!-- Golden Ray Halo Behind Cyrus King -->
  <circle cx="256" cy="245" r="140" fill="#ffd24d" opacity="0.08" filter="url(#goldGlow)" />

  <!-- CYRUS THE GREAT CHESS KING (MAIN HERO PIECE) -->
  <g filter="url(#goldGlow)">
    <!-- Base Pedestal with Stepped Persian Design -->
    <path d="M128 418 h256 v-32 c-25 -14 -60 -22 -128 -22 s-103 8 -128 22 z" fill="url(#goldCrownGrad)" stroke="#452702" stroke-width="7" stroke-linejoin="round" />
    <line x1="148" y1="400" x2="364" y2="400" stroke="#fff7cc" stroke-width="4" stroke-linecap="round" />

    <!-- Imperial Torso Robe -->
    <path d="M164 364 C146 295 190 238 256 238 C322 238 366 295 348 364 Z" fill="url(#goldCrownGrad)" stroke="#452702" stroke-width="7" stroke-linejoin="round" />

    <!-- Cyrus the Great Imperial Crown (تاج هخامنشی با کنگره‌های زرین) -->
    <path d="M174 220 L195 130 L230 162 L256 94 L282 162 L317 130 L338 220 Z" fill="url(#goldCrownGrad)" stroke="#452702" stroke-width="7" stroke-linejoin="round" />

    <!-- Central Royal Sun Crest on Crown -->
    <circle cx="256" cy="94" r="22" fill="#ffd24d" stroke="#452702" stroke-width="6" />
    <circle cx="256" cy="94" r="11" fill="url(#rubyGrad)" />

    <!-- Turquoise Jewels on Crown Points -->
    <circle cx="195" cy="130" r="10" fill="url(#turquoiseGrad)" stroke="#452702" stroke-width="4" />
    <circle cx="317" cy="130" r="10" fill="url(#turquoiseGrad)" stroke="#452702" stroke-width="4" />

    <!-- Royal Torc / Medallion -->
    <circle cx="256" cy="286" r="32" fill="none" stroke="#fff7cc" stroke-width="7" />
    <polygon points="256,268 262,284 278,284 265,294 270,310 256,300 242,310 247,294 234,284 250,284" fill="url(#rubyGrad)" stroke="#452702" stroke-width="2" />

    <!-- Lightning Speed Streak (Indicating 30s Speed Boosters) -->
    <path d="M370 180 L340 250 L380 250 L330 360" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#goldGlow)" />
  </g>

  <!-- App Title Banner at Bottom -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffd24d" letter-spacing="4">
    WORLDPLAY
  </text>
</svg>
